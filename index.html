<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Y así empezó todo... ❤️</title>

    <!-- Google Fonts: Edu VIC WA NT Hand + Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Edu+VIC+WA+NT+Hand:wght@400;600;700&family=Quicksand:wght@300;400;600&display=swap" rel="stylesheet" />

    <style>
        /* ===== RESET Y ESTILOS BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Quicksand', sans-serif;
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* ===== CANVAS DE FONDO ===== */
        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            display: block;
        }

        /* ===== TÍTULO PRINCIPAL ===== */
        .main-header {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        .main-header h1 {
            font-family: 'Edu VIC WA NT Hand', cursive;
            font-size: clamp(3.5rem, 10vw, 7rem);
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 200, 200, 0.3), 0 0 80px rgba(255, 100, 100, 0.2);
            animation: fadeInDown 1.5s ease;
            letter-spacing: 2px;
        }

        .main-header .subtitle {
            font-size: 1.3rem;
            color: rgba(255, 255, 255, 0.7);
            margin-top: 1rem;
            font-weight: 300;
            letter-spacing: 4px;
            animation: fadeInUp 2s ease;
        }

        .main-header .heart-decoration {
            font-size: 4rem;
            animation: pulseHeart 2s ease-in-out infinite;
            margin-top: 1.5rem;
        }

        @keyframes fadeInDown {
            0% {
                opacity: 0;
                transform: translateY(-60px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            0% {
                opacity: 0;
                transform: translateY(40px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes pulseHeart {
            0%,
            100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.2);
            }
        }

        /* ===== SCROLL INDICATOR ===== */
        .scroll-indicator {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.8rem;
            letter-spacing: 2px;
            animation: bounceDown 2s infinite;
        }

        .scroll-indicator .arrow {
            font-size: 1.8rem;
        }

        @keyframes bounceDown {
            0%,
            100% {
                transform: translateX(-50%) translateY(0);
            }
            50% {
                transform: translateX(-50%) translateY(12px);
            }
        }

        /* ===== LÍNEA DEL TIEMPO LATERAL ===== */
        .timeline-progress {
            position: fixed;
            left: 30px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .timeline-progress .line {
            width: 3px;
            height: 60vh;
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
            position: relative;
            overflow: visible;
        }

        .timeline-progress .line .fill {
            width: 100%;
            height: 0%;
            background: linear-gradient(180deg, #ff6b6b, #ffd93d);
            border-radius: 4px;
            transition: height 0.3s ease;
            position: relative;
        }

        .timeline-progress .line .fill::after {
            content: '💖';
            position: absolute;
            top: -12px;
            right: -14px;
            font-size: 1.6rem;
            filter: drop-shadow(0 0 12px rgba(255, 100, 100, 0.6));
            transition: transform 0.3s ease;
        }

        .timeline-progress .dots {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            margin-top: 4px;
        }

        .timeline-progress .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            transition: all 0.4s ease;
            position: relative;
        }

        .timeline-progress .dot.active {
            background: #ff6b6b;
            border-color: #ff6b6b;
            box-shadow: 0 0 20px rgba(255, 100, 100, 0.5);
            transform: scale(1.25);
        }

        .timeline-progress .dot.done {
            background: #ffd93d;
            border-color: #ffd93d;
            opacity: 0.6;
        }

        /* ===== CONTENEDOR DE MOMENTOS ===== */
        .moments-container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 80px 80px 100px;
            position: relative;
            z-index: 1;
        }

        /* ===== TARJETA DE MOMENTO ===== */
        .moment-card {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 2rem;
            margin-bottom: 4rem;
            border: 1.5px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
            transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1), box-shadow 0.5s ease, border-color 0.5s ease;
            opacity: 0;
            transform: translateY(60px) scale(0.96);
            position: relative;
            overflow: hidden;
        }

        .moment-card.visible {
            opacity: 1;
            transform: translateY(0) scale(1);
        }

        .moment-card:hover {
            transform: translateY(-6px) scale(1.01);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.4);
            border-color: rgba(255, 255, 255, 0.25);
        }

        /* Borde acorde al fondo */
        .moment-card .card-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 24px;
            padding: 3px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.2), rgba(255, 255, 255, 0.05));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            transition: all 0.8s ease;
        }

        /* ===== FOTOS ===== */
        .moment-card .photos {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 1.2rem;
        }

        .moment-card .photos .photo-wrapper {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            aspect-ratio: 1 / 1;
            background: rgba(0, 0, 0, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.4s ease, border-color 0.4s ease;
        }

        .moment-card .photos .photo-wrapper:hover {
            transform: scale(1.03);
            border-color: rgba(255, 255, 255, 0.3);
            z-index: 2;
        }

        .moment-card .photos .photo-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.6s ease;
        }

        .moment-card .photos .photo-wrapper:hover img {
            transform: scale(1.08);
        }

        .moment-card .photos .photo-wrapper .photo-overlay {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 1.5rem 1rem 0.8rem;
            background: linear-gradient(transparent, rgba(0, 0, 0, 0.5));
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .moment-card .photos .photo-wrapper:hover .photo-overlay {
            opacity: 1;
        }

        .moment-card .photos .photo-wrapper .photo-overlay span {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.7);
            font-weight: 300;
            letter-spacing: 1px;
        }

        /* ===== TEXTO DE MOMENTO ===== */
        .moment-card .date {
            font-family: 'Edu VIC WA NT Hand', cursive;
            font-size: 1.4rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 0.3rem;
            letter-spacing: 1px;
        }

        .moment-card .text {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.15rem;
            font-weight: 400;
            line-height: 1.7;
            color: rgba(255, 255, 255, 0.92);
        }

        /* ===== NÚMERO DE MOMENTO ===== */
        .moment-card .moment-number {
            position: absolute;
            top: -14px;
            right: 24px;
            font-family: 'Edu VIC WA NT Hand', cursive;
            font-size: 2.8rem;
            font-weight: 700;
            color: rgba(255, 255, 255, 0.06);
            pointer-events: none;
            user-select: none;
        }

        /* ===== BOTÓN REPRODUCTOR ===== */
        .music-btn {
            position: fixed;
            bottom: 30px;
            right: 30px;
            z-index: 200;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1.5px solid rgba(255, 255, 255, 0.15);
            font-size: 2.2rem;
            cursor: pointer;
            transition: all 0.4s ease;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        .music-btn:hover {
            transform: scale(1.12);
            border-color: rgba(255, 100, 100, 0.4);
            box-shadow: 0 8px 48px rgba(255, 100, 100, 0.2);
        }

        .music-btn.playing {
            animation: pulseMusic 1.5s ease-in-out infinite;
            border-color: #ff6b6b;
        }

        @keyframes pulseMusic {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(255, 100, 100, 0.2);
            }
            50% {
                box-shadow: 0 0 50px rgba(255, 100, 100, 0.5);
            }
        }

        /* ===== BOTÓN SUBIR ===== */
        .scroll-top-btn {
            position: fixed;
            bottom: 110px;
            right: 30px;
            z-index: 200;
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: none;
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-size: 1.4rem;
            cursor: pointer;
            transition: all 0.4s ease;
            color: rgba(255, 255, 255, 0.6);
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .scroll-top-btn:hover {
            transform: translateY(-4px);
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .scroll-top-btn.show {
            display: flex;
        }

        /* ===== BOTÓN SORPRESA FINAL ===== */
        .surprise-btn {
            display: block;
            margin: 3rem auto 6rem;
            padding: 1rem 3rem;
            border-radius: 60px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            font-family: 'Edu VIC WA NT Hand', cursive;
            font-size: 1.5rem;
            color: #fff;
            cursor: pointer;
            transition: all 0.5s ease;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
            position: relative;
            overflow: hidden;
        }

        .surprise-btn:hover {
            transform: scale(1.05);
            border-color: #ff6b6b;
            background: rgba(255, 100, 100, 0.15);
            box-shadow: 0 8px 48px rgba(255, 100, 100, 0.3);
        }

        .surprise-btn .sparkle {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(255, 255, 255, 0.2), transparent 70%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .surprise-btn:hover .sparkle {
            opacity: 1;
        }

        /* ===== CONTENEDOR DE FUEGOS ARTIFICIALES ===== */
        .fireworks-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 300;
            overflow: hidden;
        }

        .firework-particle {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            animation: fireworkExplode 1.8s ease-out forwards;
        }

        @keyframes fireworkExplode {
            0% {
                opacity: 1;
                transform: translate(0, 0) scale(0.5);
            }
            100% {
                opacity: 0;
                transform: translate(var(--tx), var(--ty)) scale(0);
            }
        }

        .firework-text {
            position: absolute;
            font-family: 'Edu VIC WA NT Hand', cursive;
            font-size: 4rem;
            font-weight: 700;
            color: #fff;
            text-shadow: 0 0 40px rgba(255, 200, 100, 0.8), 0 0 80px rgba(255, 100, 100, 0.6);
            pointer-events: none;
            animation: textExplode 2.5s ease-out forwards;
        }

        @keyframes textExplode {
            0% {
                opacity: 0;
                transform: scale(0.3) rotate(-10deg);
            }
            30% {
                opacity: 1;
                transform: scale(1.3) rotate(3deg);
            }
            60% {
                transform: scale(1) rotate(0deg);
            }
            100% {
                opacity: 1;
                transform: scale(1) rotate(0deg);
            }
        }

        .firework-text.fade-out {
            animation: textFadeOut 1.5s ease-in forwards;
        }

        @keyframes textFadeOut {
            0% {
                opacity: 1;
                transform: scale(1);
            }
            100% {
                opacity: 0;
                transform: scale(1.5) translateY(-40px);
            }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .timeline-progress {
                left: 12px;
            }
            .timeline-progress .line {
                height: 40vh;
            }
            .moments-container {
                padding: 20px 20px 60px 50px;
            }
            .moment-card {
                padding: 1.2rem;
                border-radius: 18px;
            }
            .moment-card .photos {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .moment-card .date {
                font-size: 1.1rem;
            }
            .moment-card .text {
                font-size: 1rem;
            }
            .main-header h1 {
                font-size: clamp(2.5rem, 8vw, 4rem);
            }
            .music-btn {
                width: 52px;
                height: 52px;
                font-size: 1.6rem;
                bottom: 20px;
                right: 20px;
            }
            .scroll-top-btn {
                bottom: 90px;
                right: 20px;
                width: 42px;
                height: 42px;
                font-size: 1.2rem;
            }
            .timeline-progress .dot {
                width: 8px;
                height: 8px;
            }
            .moment-card .moment-number {
                font-size: 2rem;
                top: -10px;
                right: 16px;
            }
            .surprise-btn {
                font-size: 1.2rem;
                padding: 0.8rem 2rem;
            }
        }

        @media (max-width: 480px) {
            .timeline-progress {
                display: none;
            }
            .moments-container {
                padding: 20px 16px 40px;
            }
            .moment-card .photos {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .moment-card .photos .photo-wrapper {
                border-radius: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== CANVAS DE FONDO ANIMADO ===== -->
    <canvas id="bgCanvas"></canvas>

    <!-- ===== LÍNEA DEL TIEMPO LATERAL ===== -->
    <div class="timeline-progress" id="timelineProgress">
        <div class="line">
            <div class="fill" id="progressFill"></div>
        </div>
        <div class="dots" id="dotsContainer"></div>
    </div>

    <!-- ===== BOTÓN REPRODUCTOR ===== -->
    <button class="music-btn" id="musicBtn" title="Ella es mi fiesta 🎵">
        ❤️
    </button>

    <!-- ===== BOTÓN SUBIR ===== -->
    <button class="scroll-top-btn" id="scrollTopBtn" title="Subir al inicio">↑</button>

    <!-- ===== CONTENEDOR DE FUEGOS ARTIFICIALES ===== -->
    <div class="fireworks-container" id="fireworksContainer"></div>

    <!-- ===== AUDIO (invisible) ===== -->
    <audio id="audioPlayer" loop preload="auto">
        <source src="audio/ella-es-mi-fiesta.mp3" type="audio/mpeg" />
        Tu navegador no soporta el elemento de audio.
    </audio>

    <!-- ===== CONTENIDO PRINCIPAL ===== -->
    <header class="main-header">
        <h1>Y así empezó todo...</h1>
        <p class="subtitle">6 meses · 23 momentos · una vida entera</p>
        <div class="heart-decoration">❤️</div>
        <div class="scroll-indicator">
            <span>DESCUBRE LA HISTORIA</span>
            <span class="arrow">↓</span>
        </div>
    </header>

    <div class="moments-container" id="momentsContainer">
        <!-- Los momentos se generan con JavaScript -->
    </div>

    <script>
        // ============================================================
        // 1. CANVAS - FONDOS ANIMADOS POR ESTACIONES
        // ============================================================
        const canvas = document.getElementById('bgCanvas');
        const ctx = canvas.getContext('2d');

        let W, H;

        function resizeCanvas() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // ============================================================
        // 2. PARTÍCULAS POR ESTACIÓN
        // ============================================================
        let particles = [];
        let seasonName = 'invierno';

        // Colores base por estación
        const seasonColors = {
            invierno: {
                bg: ['#0f1a2e', '#1a2a4a', '#3a5a7a', '#8a9aaa'],
                particleColor: 'rgba(255,255,255,0.7)',
                particleColor2: 'rgba(200,220,255,0.3)',
            },
            primavera: {
                bg: ['#f8a4b8', '#fcd5d0', '#b5d9c8', '#8ec9b0'],
                particleColor: 'rgba(255,150,180,0.8)',
                particleColor2: 'rgba(255,220,200,0.4)',
            },
            verano: {
                bg: ['#f9d56e', '#f5a623', '#f7c948', '#2c3e6b'],
                particleColor: 'rgba(255,220,100,0.8)',
                particleColor2: 'rgba(255,200,150,0.3)',
            },
            otono: {
                bg: ['#d4763a', '#c0392b', '#c49a2a', '#6b4c2a'],
                particleColor: 'rgba(255,180,80,0.8)',
                particleColor2: 'rgba(200,100,50,0.4)',
            }
        };

        // ============================================================
        // 3. CREAR PARTÍCULAS SEGÚN ESTACIÓN
        // ============================================================
        function createParticles(season) {
            particles = [];
            const count = season === 'invierno' ? 120 :
                season === 'primavera' ? 100 :
                season === 'verano' ? 80 :
                90;

            for (let i = 0; i < count; i++) {
                let type = 'particle';
                let size, color, speedX, speedY, rotation, rotationSpeed;

                if (season === 'invierno') {
                    // Copos de nieve
                    type = Math.random() > 0.3 ? 'snow' : 'star';
                    size = 2 + Math.random() * 8;
                    color = `rgba(255,255,255,${0.3 + Math.random() * 0.5})`;
                    speedX = (Math.random() - 0.5) * 0.3;
                    speedY = 0.2 + Math.random() * 0.8;
                    rotation = Math.random() * Math.PI * 2;
                    rotationSpeed = (Math.random() - 0.5) * 0.02;

                    // Estrellas fugaces (especiales)
                    if (Math.random() > 0.95) {
                        type = 'shootingStar';
                        size = 2;
                        color = 'rgba(255,255,255,0.9)';
                        speedX = -2 - Math.random() * 3;
                        speedY = 1 + Math.random() * 2;
                    }
                } else if (season === 'primavera') {
                    // Pétalos de sakura
                    type = 'sakura';
                    size = 6 + Math.random() * 12;
                    const pink = 150 + Math.random() * 105;
                    color = `rgba(${255}, ${pink}, ${180 + Math.random() * 50}, ${0.6 + Math.random() * 0.3})`;
                    speedX = (Math.random() - 0.5) * 0.5;
                    speedY = 0.3 + Math.random() * 0.8;
                    rotation = Math.random() * Math.PI * 2;
                    rotationSpeed = (Math.random() - 0.5) * 0.03;

                    // Luciérnagas
                    if (Math.random() > 0.92) {
                        type = 'firefly';
                        size = 3 + Math.random() * 4;
                        color = `rgba(255, 200, 220, ${0.5 + Math.random() * 0.5})`;
                        speedX = (Math.random() - 0.5) * 0.2;
                        speedY = (Math.random() - 0.5) * 0.2;
                    }
                } else if (season === 'verano') {
                    // Destellos de sol
                    type = 'sparkle';
                    size = 2 + Math.random() * 6;
                    color = `rgba(255, 220, ${100 + Math.random() * 100}, ${0.4 + Math.random() * 0.5})`;
                    speedX = (Math.random() - 0.5) * 0.1;
                    speedY = -0.1 - Math.random() * 0.3;
                    rotation = Math.random() * Math.PI * 2;
                    rotationSpeed = (Math.random() - 0.5) * 0.01;
                } else if (season === 'otono') {
                    // Hojas de otoño
                    type = 'leaf';
                    size = 8 + Math.random() * 16;
                    const r = 150 + Math.random() * 105;
                    const g = 60 + Math.random() * 100;
                    const b = 20 + Math.random() * 40;
                    color = `rgba(${r}, ${g}, ${b}, ${0.6 + Math.random() * 0.3})`;
                    speedX = (Math.random() - 0.5) * 0.6;
                    speedY = 0.3 + Math.random() * 0.9;
                    rotation = Math.random() * Math.PI * 2;
                    rotationSpeed = (Math.random() - 0.5) * 0.04;
                }

                particles.push({
                    x: Math.random() * W,
                    y: Math.random() * H,
                    size: size,
                    color: color,
                    speedX: speedX || 0,
                    speedY: speedY || 0.3,
                    rotation: rotation || 0,
                    rotationSpeed: rotationSpeed || 0,
                    type: type || 'particle',
                    opacity: 0.5 + Math.random() * 0.5,
                    life: Math.random() * 200,
                    maxLife: 200 + Math.random() * 200,
                    // Para luciérnagas
                    phase: Math.random() * Math.PI * 2,
                    // Para hojas
                    swing: Math.random() * 0.5,
                    swingSpeed: 0.01 + Math.random() * 0.02,
                });
            }
        }

        // ============================================================
        // 4. DIBUJAR FONDO
        // ============================================================
        function drawBackground(season) {
            const colors = seasonColors[season].bg;
            const gradient = ctx.createLinearGradient(0, 0, 0, H);
            gradient.addColorStop(0, colors[0]);
            gradient.addColorStop(0.3, colors[1]);
            gradient.addColorStop(0.6, colors[2]);
            gradient.addColorStop(1, colors[3]);
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, W, H);

            // Efecto de brillo central en otoño
            if (season === 'otono') {
                const glow = ctx.createRadialGradient(W / 2, H * 0.4, 0, W / 2, H * 0.4, H * 0.6);
                glow.addColorStop(0, 'rgba(255,200,100,0.08)');
                glow.addColorStop(0.5, 'rgba(200,150,50,0.05)');
                glow.addColorStop(1, 'rgba(0,0,0,0)');
                ctx.fillStyle = glow;
                ctx.fillRect(0, 0, W, H);
            }

            // Olas en verano (parte inferior)
            if (season === 'verano') {
                ctx.globalAlpha = 0.15;
                for (let i = 0; i < 3; i++) {
                    ctx.beginPath();
                    ctx.moveTo(0, H - 20 - i * 20);
                    for (let x = 0; x <= W; x += 5) {
                        const y = H - 20 - i * 20 + Math.sin(x * 0.02 + Date.now() * 0.001 + i) * 6;
                        ctx.lineTo(x, y);
                    }
                    ctx.lineTo(W, H);
                    ctx.lineTo(0, H);
                    ctx.closePath();
                    ctx.fillStyle = `rgba(255,255,255,${0.05 - i * 0.015})`;
                    ctx.fill();
                }
                ctx.globalAlpha = 1;
            }

            // Luces navideñas en invierno
            if (season === 'invierno') {
                ctx.globalAlpha = 0.2;
                for (let i = 0; i < 12; i++) {
                    const x = (i / 12) * W + Math.sin(Date.now() * 0.001 + i * 2) * 10;
                    const y = 20 + Math.sin(Date.now() * 0.002 + i * 3) * 5;
                    const colors2 = ['#ff6b6b', '#ffd93d', '#6bcfff', '#ff9ff3', '#54a0ff'];
                    ctx.beginPath();
                    ctx.arc(x, y, 4 + Math.sin(Date.now() * 0.002 + i) * 2, 0, Math.PI * 2);
                    ctx.fillStyle = colors2[i % colors2.length];
                    ctx.shadowColor = colors2[i % colors2.length];
                    ctx.shadowBlur = 20;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }
                ctx.globalAlpha = 1;
            }
        }

        // ============================================================
        // 5. DIBUJAR PARTÍCULAS
        // ============================================================
        function drawParticles(season) {
            const time = Date.now();

            particles.forEach((p, index) => {
                // Actualizar posición
                p.x += p.speedX;
                p.y += p.speedY;

                // Comportamientos especiales
                if (p.type === 'shootingStar') {
                    p.speedX = -2 - Math.random() * 3;
                    p.speedY = 1 + Math.random() * 2;
                    p.opacity = 0.5 + Math.sin(time * 0.01 + index) * 0.3;
                }

                if (p.type === 'firefly') {
                    p.phase += 0.02;
                    p.x += Math.sin(p.phase) * 0.3;
                    p.y += Math.cos(p.phase * 0.7) * 0.2;
                    p.opacity = 0.4 + Math.sin(p.phase * 1.5) * 0.3;
                }

                if (p.type === 'leaf') {
                    p.rotation += p.rotationSpeed;
                    p.swing += p.swingSpeed;
                    p.x += Math.sin(p.swing) * 0.3;
                    // Caída más orgánica
                    p.speedY += 0.001;
                }

                if (p.type === 'sakura') {
                    p.rotation += p.rotationSpeed;
                    p.x += Math.sin(p.rotation) * 0.1;
                    // Espiral suave
                    p.x += Math.sin(time * 0.001 + index) * 0.05;
                }

                if (p.type === 'sparkle') {
                    p.opacity = 0.3 + Math.sin(time * 0.005 + index * 2) * 0.5;
                }

                // Rebote en bordes
                if (p.x < 0) p.x = W;
                if (p.x > W) p.x = 0;
                if (p.y < -50) p.y = H + 30;
                if (p.y > H + 50) {
                    p.y = -30;
                    if (p.type === 'shootingStar') {
                        p.x = Math.random() * W;
                    }
                }

                // Dibujar
                ctx.save();

                if (p.type === 'shootingStar') {
                    ctx.globalAlpha = p.opacity * 0.8;
                    ctx.shadowColor = 'rgba(255,255,255,0.5)';
                    ctx.shadowBlur = 30;
                    ctx.beginPath();
                    ctx.moveTo(p.x, p.y);
                    ctx.lineTo(p.x - p.speedX * 30, p.y - p.speedY * 30);
                    ctx.strokeStyle = 'rgba(255,255,255,0.6)';
                    ctx.lineWidth = 2;
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'sakura') {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.globalAlpha = p.opacity * 0.9;
                    // Pétalo en forma de corazón/hoja
                    ctx.shadowColor = 'rgba(255,150,180,0.2)';
                    ctx.shadowBlur = 10;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size / 2, p.size / 3, 0, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    // Detalle del pétalo
                    ctx.beginPath();
                    ctx.ellipse(2, -2, p.size / 4, p.size / 5, 0.3, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,0.2)';
                    ctx.fill();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'leaf') {
                    ctx.translate(p.x, p.y);
                    ctx.rotate(p.rotation);
                    ctx.globalAlpha = p.opacity;
                    ctx.shadowColor = 'rgba(0,0,0,0.1)';
                    ctx.shadowBlur = 8;
                    ctx.beginPath();
                    ctx.ellipse(0, 0, p.size / 2, p.size / 3, 0, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    // Vena de la hoja
                    ctx.beginPath();
                    ctx.moveTo(-p.size / 4, 0);
                    ctx.lineTo(p.size / 4, 0);
                    ctx.strokeStyle = 'rgba(0,0,0,0.1)';
                    ctx.lineWidth = 1;
                    ctx.stroke();
                    ctx.shadowBlur = 0;
                } else if (p.type === 'sparkle') {
                    ctx.translate(p.x, p.y);
                    ctx.globalAlpha = p.opacity * 0.7;
                    const s = p.size * (0.5 + Math.sin(time * 0.003 + index) * 0.3);
                    ctx.shadowColor = 'rgba(255,220,100,0.3)';
                    ctx.shadowBlur = 20;
                    // Estrella de 4 puntas
                    for (let i = 0; i < 4; i++) {
                        const angle = (i / 4) * Math.PI * 2 + time * 0.001;
                        ctx.beginPath();
                        ctx.moveTo(0, 0);
                        ctx.lineTo(Math.cos(angle) * s, Math.sin(angle) * s);
                        ctx.strokeStyle = p.color;
                        ctx.lineWidth = 2;
                        ctx.stroke();
                    }
                    ctx.shadowBlur = 0;
                } else {
                    // Nieve normal
                    ctx.globalAlpha = p.opacity * 0.8;
                    ctx.shadowColor = 'rgba(255,255,255,0.1)';
                    ctx.shadowBlur = 6;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size / 2, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                }

                ctx.restore();
                ctx.globalAlpha = 1;
            });
        }

        // ============================================================
        // 6. LOOP DE ANIMACIÓN
        // ============================================================
        function animate() {
            drawBackground(seasonName);
            drawParticles(seasonName);
            requestAnimationFrame(animate);
        }

        // ============================================================
        // 7. CAMBIAR ESTACIÓN
        // ============================================================
        function setSeason(season) {
            if (season === seasonName) return;
            seasonName = season;
            createParticles(season);
        }

        // Inicializar invierno
        createParticles('invierno');

        // ============================================================
        // 8. DETECTAR ESTACIÓN SEGÚN SCROLL
        // ============================================================
        const seasonMap = [
            { name: 'invierno', start: 0, end: 6 },
            { name: 'primavera', start: 7, end: 13 },
            { name: 'verano', start: 14, end: 18 },
            { name: 'otono', start: 19, end: 22 },
        ];

        let currentSeason = 'invierno';

        function updateSeason() {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const docHeight = document.documentElement.scrollHeight;
            const scrollPercent = scrollY / (docHeight - windowHeight);

            // Calcular índice aproximado basado en scroll
            const totalMoments = 23;
            const approxIndex = Math.floor(scrollPercent * totalMoments);

            for (const s of seasonMap) {
                if (approxIndex >= s.start && approxIndex <= s.end) {
                    if (s.name !== currentSeason) {
                        currentSeason = s.name;
                        setSeason(s.name);
                    }
                    break;
                }
            }
        }

        window.addEventListener('scroll', updateSeason);
        window.addEventListener('resize', () => {
            resizeCanvas();
            // Recrear partículas con nuevo tamaño
            createParticles(seasonName);
        });

        // ============================================================
        // 10. RENDERIZAR MOMENTOS
        // ============================================================
        const container = document.getElementById('momentsContainer');
        const dotsContainer = document.getElementById('dotsContainer');

        // Generar puntos de la línea de tiempo
        moments.forEach((_, index) => {
            const dot = document.createElement('div');
            dot.className = 'dot';
            dot.dataset.index = index;
            dotsContainer.appendChild(dot);
        });

        // Generar tarjetas
        moments.forEach((moment, index) => {

            card.className = 'moment-card';
            card.dataset.index = index;

            card.innerHTML = `
                        <div class="card-border"></div>

                        <div class="photos">
                            <div class="photo-wrapper">
                                <img src="imagenes/${moment.id}.jpg" alt="Momento ${moment.id}" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect fill=%22%23333%22 width=%22300%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-family=%22Arial%22 font-size=%2240%22%3E📸%3C/text%3E%3C/svg%3E'" />
                                <div class="photo-overlay"><span>${moment.id}</span></div>
                            </div>
                            <div class="photo-wrapper">
                                <img src="imagenes/${moment.id}-2.jpg" alt="Momento ${moment.id} - 2" loading="lazy" onerror="this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%22300%22 height=%22300%22%3E%3Crect fill=%22%23333%22 width=%22300%22 height=%22300%22/%3E%3Ctext x=%2250%25%22 y=%2250%25%22 text-anchor=%22middle%22 dy=%22.3em%22 fill=%22%23666%22 font-family=%22Arial%22 font-size=%2240%22%3E📸%3C/text%3E%3C/svg%3E'" />
                                <div class="photo-overlay"><span>${moment.id}</span></div>
                            </div>
                        </div>
                        <div class="date">${moment.date}</div>
                        <div class="text">${moment.text}</div>
                    `;

            container.appendChild(card);
        });

        // ============================================================
        // 11. OBSERVER PARA ANIMACIONES DE TARJETAS
        // ============================================================
        const cards = document.querySelectorAll('.moment-card');
        const dots = document.querySelectorAll('.dot');
        const progressFill = document.getElementById('progressFill');

        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const card = entry.target;
                    const index = parseInt(card.dataset.index);
                    card.classList.add('visible');

                    dots.forEach((dot, i) => {
                        dot.classList.remove('active', 'done');
                        if (i < index) dot.classList.add('done');
                        if (i === index) dot.classList.add('active');
                    });

                    const progress = ((index + 1) / dots.length) * 100;
                    progressFill.style.height = `${progress}%`;
                }
            });
        }, {
            threshold: 0.25,
            rootMargin: '0px 0px -80px 0px'
        });

        cards.forEach(card => observer.observe(card));

            } else {
                scrollTopBtn.classList.remove('show');
            }
        });

        scrollTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // ============================================================
        // 13. REPRODUCTOR DE MÚSICA
        // ============================================================
        const musicBtn = document.getElementById('musicBtn');
        const audio = document.getElementById('audioPlayer');
        let isPlaying = false;

        musicBtn.addEventListener('click', () => {
            if (isPlaying) {
                audio.pause();
                musicBtn.textContent = '❤️';
                musicBtn.classList.remove('playing');
                isPlaying = false;
            } else {
                audio.play().catch(() => {});
                musicBtn.textContent = '🎵';
                musicBtn.classList.add('playing');
                isPlaying = true;
            }
        });

        // 14. BOTÓN SORPRESA FINAL
        // ============================================================
        const surpriseBtn = document.createElement('button');
        surpriseBtn.className = 'surprise-btn';
        surpriseBtn.innerHTML = `
                    💖 ¿Quieres seguir escribiendo esta historia conmigo? 💖
                    <span class="sparkle"></span>
                `;
        surpriseBtn.id = 'surpriseBtn';
        container.appendChild(surpriseBtn);

        surpriseBtn.addEventListener('click', (e) => {
            const rect = surpriseBtn.getBoundingClientRect();
            const x = ((e.clientX - rect.left) / rect.width) * 100;
            const y = ((e.clientY - rect.top) / rect.height) * 100;
            surpriseBtn.style.setProperty('--x', `${x}%`);
            surpriseBtn.style.setProperty('--y', `${y}%`);

            launchFireworksWithText('¡TE AMO! 💕');

            surpriseBtn.innerHTML = '💕 ¡SÍ, SIEMPRE! 💕';

            setTimeout(() => {

            setTimeout(() => launchFireworksWithText(' TE AMOOOOOO '), 2400);

        });

        // ============================================================
        // 15. FUEGOS ARTIFICIALES
        // ============================================================
        const fireworksContainer = document.getElementById('fireworksContainer');

        function launchFireworksWithText(text) {
            const textEl = document.createElement('div');
            textEl.className = 'firework-text';
            textEl.textContent = text;
            textEl.style.left = '50%';
            textEl.style.top = '50%';
            textEl.style.transform = 'translate(-50%, -50%)';
            fireworksContainer.appendChild(textEl);

            const colors = ['#ff6b6b', '#ffd93d', '#ff9ff3', '#54a0ff', '#5f27cd', '#ff9f43', '#00d2d3', '#f368e0'];
            const numParticles = 60;

            for (let i = 0; i < numParticles; i++) {
                const particle = document.createElement('div');
                particle.className = 'firework-particle';
                const angle = Math.random() * 2 * Math.PI;
                const distance = 150 + Math.random() * 350;
                const tx = Math.cos(angle) * distance;
                const ty = Math.sin(angle) * distance - 100;
                const size = 6 + Math.random() * 14;
                const color = colors[Math.floor(Math.random() * colors.length)];

                particle.style.width = `${size}px`;
                particle.style.height = `${size}px`;
                particle.style.background = color;
                particle.style.left = '50%';
                particle.style.top = '50%';
                particle.style.setProperty('--tx', `${tx}px`);
                particle.style.setProperty('--ty', `${ty}px`);
                particle.style.boxShadow = `0 0 ${size * 2}px ${color}`;
                particle.style.animationDuration = `${1.2 + Math.random() * 0.8}s`;

                fireworksContainer.appendChild(particle);

                setTimeout(() => {
                    particle.remove();
                }, 2500);
            }

            setTimeout(() => {
                textEl.classList.add('fade-out');
                setTimeout(() => {
                    textEl.remove();
                }, 1500);
            }, 2000);

            setTimeout(() => {
                document.querySelectorAll('.firework-particle').forEach(p => p.remove());
            }, 2800);
        }

        // ============================================================
        // 16. DETECTAR CUANDO SE LLEGA AL FINAL
        // ============================================================
        let finalTriggered = false;

        const finalObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !finalTriggered) {
                    const index = parseInt(entry.target.dataset.index);
                    if (index === moments.length - 1) {
                        finalTriggered = true;
                        setTimeout(() => launchFireworksWithText('6 MESES ❤️'), 800);
                        setTimeout(() => launchFireworksWithText('💕'), 1600);
                    }
                }
            });
        }, { threshold: 0.3 });

        const lastCard = document.querySelector('.moment-card:last-child');
        if (lastCard) {
            finalObserver.observe(lastCard);
        }

        // ============================================================
        // 17. INICIALIZAR
        // ============================================================
        setTimeout(() => {
            const firstCard = document.querySelector('.moment-card');
            if (firstCard) {
                const rect = firstCard.getBoundingClientRect();
                if (rect.top < window.innerHeight) {
                    firstCard.classList.add('visible');
                    dots[0]?.classList.add('active');
                }
            }
        }, 500);

        console.log('%c ❤️ 6 MESES CONTIGO ❤️ ', 'font-size: 24px; background: #ff6b6b; color: white; padding: 12px 24px; border-radius: 12px;');
        console.log('%c Esta página está hecha con todo el amor del mundo para ti. ', 'font-size: 16px; color: #ff6b6b;');
        console.log('%c Y así empezó todo... y esto es solo el comienzo. ', 'font-size: 14px; color: #888;');
        console.log('📸 IDs de fotos esperados:');
        moments.forEach(m => console.log(`   - ${m.id}.jpg y ${m.id}-2.jpg`));
        console.log('🎵 Audio esperado: audio/ella-es-mi-fiesta.mp3');
        console.log('💖 ¡Disfruta el viaje!');
    </script>
